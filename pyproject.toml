[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radchain"
version = "0.1.0"
description = "End-to-end radiation -> phonon -> quasiparticle -> logical-error simulation for superconducting qubit chips"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND CC-BY-4.0"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
analysis = ["stim>=1.13", "pymatching>=2.2", "matplotlib>=3.8"]
geant4 = ["geant4_pybind"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radchain = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running test"]
